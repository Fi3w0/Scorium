name: Bug report
description: Report something in Scorium that is broken or behaves wrong.
title: "bug: <short summary>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Security vulnerability? Do NOT use this template.** See
        [SECURITY.md](../../SECURITY.md) and report it privately instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behaviour. What did you expect instead?
      placeholder: |
        `scorium eval` panics on the file below; I expected it to print the tree.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The smallest `.scor` file (or Rust snippet) that triggers the bug.
        Paste it inside a code fence. If you can reproduce from the CLI, show
        the exact command and its output.
      placeholder: |
        ```scor
        server {
            port = 8080
        }
        ```
        ```
        cargo run -p scorium-cli -- eval repro.scor
        ```
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Scorium version
      description: The version from `Cargo.toml`, or the commit hash if you build from `main`.
      placeholder: "0.1.0 (commit f4bc39c)"
    validations:
      required: true

  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc --version`.
      placeholder: "rustc 1.97.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - scorium-core (lexer / parser / AST / values)
        - scorium-lua (evaluator / sandbox / control flow / includes)
        - scorium-schema (validation / suggestions / custom types)
        - scorium-format (formatter)
        - scorium-cli (check / parse / fmt / eval)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, related issues, workarounds, or anything else relevant.
    validations:
      required: false
