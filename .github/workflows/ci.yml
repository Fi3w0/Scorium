name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets, all features, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace --all-features

  cli-smoke:
    name: CLI smoke tests on examples
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p scorium-cli

      - name: scorium check examples/basic.scor
        run: cargo run -p scorium-cli -- check examples/basic.scor

      - name: scorium fmt --check on every example
        run: |
          for f in examples/*.scor; do
            echo "checking $f"
            cargo run -p scorium-cli -- fmt --check "$f"
          done

      - name: scorium parse examples/variables.scor
        run: cargo run -p scorium-cli -- parse examples/variables.scor > /dev/null

      - name: scorium eval examples/conditions.scor
        run: cargo run -p scorium-cli -- eval examples/conditions.scor > /dev/null

      - name: Run the embedding example
        run: cargo run -p scorium-embedding-example > /dev/null
